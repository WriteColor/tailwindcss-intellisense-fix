name: Build & Publish Release

on:
  push:
    tags:
      - 'v*'
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: 'Version tag to release (e.g. v0.16.0)'
        required: false
        default: ''

permissions:
  contents: write
  packages: write
  id-token: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4


      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install

      - name: Build Core Class Fixer & CLI
        run: |
          pnpm --filter=@tailwindcss/class-fixer run build
          pnpm --filter=@tailwindcss/cli-fixer run build

      - name: Build Language Service & Server
        run: |
          pnpm --filter=@tailwindcss/language-syntax run build
          pnpm --filter=@tailwindcss/language-service run build

      - name: Run Test Suite
        run: pnpm run test

      - name: Package VS Code / Antigravity Extension (.vsix)
        run: |
          pnpm --filter=tailwindcss-intellisense-fix run package
          mkdir -p release-artifacts
          cp packages/vscode-tailwindcss/*.vsix release-artifacts/


      - name: Generate Checksums
        working-directory: release-artifacts
        run: |
          sha256sum *.vsix > SHA256SUMS.txt

      - name: Create GitHub Release and Upload VSIX
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'release'
        with:
          files: |
            release-artifacts/*.vsix
            release-artifacts/SHA256SUMS.txt
          body_path: CHANGELOG.md
          draft: false
          prerelease: false


      - name: Optional Publish to Open VSX & VS Code Marketplace
        if: env.VSCODE_TOKEN != '' || env.OVSX_TOKEN != ''
        env:
          VSCODE_TOKEN: ${{ secrets.VSCODE_TOKEN }}
          OVSX_TOKEN: ${{ secrets.OVSX_TOKEN }}
        run: |
          cd packages/vscode-tailwindcss
          if [ -n "$VSCODE_TOKEN" ]; then
            pnpm exec vsce publish --no-dependencies -p $VSCODE_TOKEN || true
          fi
          if [ -n "$OVSX_TOKEN" ]; then
            pnpm exec ovsx publish *.vsix -p $OVSX_TOKEN || true
          fi
