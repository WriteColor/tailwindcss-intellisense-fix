name: CI Test Matrix

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  tests:
    strategy:
      fail-fast: false
      matrix:
        node: [18, 20, 22]
        os:
          - ubuntu-latest
          - windows-latest
          - macos-latest

    runs-on: ${{ matrix.os }}
    name: Test - Node v${{ matrix.node }} on ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4

        with:
          cache: 'pnpm'
          node-version: ${{ matrix.node }}

      - name: Install dependencies
        run: pnpm install

      - name: Build Core Class Fixer
        run: pnpm --filter=@tailwindcss/class-fixer run build

      - name: Build CLI Fixer
        run: pnpm --filter=@tailwindcss/cli-fixer run build

      - name: Build Language Service & Server
        run: |
          pnpm --filter=@tailwindcss/language-syntax run build
          pnpm --filter=@tailwindcss/language-service run build

      - name: Check VS Code Extension Types & Build
        run: pnpm --filter=vscode-tailwindcss run build

      - name: Run Test Suite across All Packages
        run: pnpm run test
